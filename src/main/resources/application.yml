spring:
  application:
    name: hospital
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hospital}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:hospital123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

hospital:
  consulta:
    duracao-minutos: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
